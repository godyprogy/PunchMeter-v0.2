<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PunchMeter v0.2 — Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #14181f;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 60px 24px;
            max-width: 720px;
            width: 100%;
        }

        .badge {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9aa3b2;
            border: 1px solid #3a4250;
            padding: 6px 16px;
            border-radius: 4px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
            margin-bottom: 12px;
        }

        h1 .accent {
            color: #d43a3a;
        }

        .tagline {
            font-size: 18px;
            color: #9aa3b2;
            margin-bottom: 48px;
        }

        .download-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 56px;
        }

        .btn {
            display: inline-block;
            padding: 18px 44px;
            font-size: 17px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .btn-primary {
            background: #d43a3a;
            color: #ffffff;
            border: 1px solid #d43a3a;
        }

        .btn-primary:hover {
            background: #b72e2e;
            border-color: #b72e2e;
        }

        .btn-secondary {
            background: transparent;
            color: #e8eaf0;
            border: 1px solid #4a5262;
        }

        .btn-secondary:hover {
            background: #1e242e;
            border-color: #6a7484;
        }

        .meta {
            border-top: 1px solid #2a3140;
            padding-top: 32px;
            display: flex;
            justify-content: center;
            gap: 48px;
            flex-wrap: wrap;
        }

        .meta-item {
            font-size: 14px;
            color: #7a8394;
        }

        .meta-item strong {
            display: block;
            color: #c8cdd8;
            font-weight: 600;
            margin-bottom: 4px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 36px; }
            .btn { padding: 16px 32px; font-size: 16px; width: 100%; }
            .download-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Windows · v0.2</div>
        <h1>Punch<span class="accent">Meter</span></h1>
        <div class="tagline">Microphone-based punch measurement and training analysis.</div>

        <div class="download-buttons">
            <a href="#" class="btn btn-primary" onclick="return false;">Download Release</a>
            <a href="#" class="btn btn-secondary" onclick="return false;">Download Source</a>
        </div>

        <div class="meta">
            <div class="meta-item">
                <strong>Real-time detection</strong>
                Automatic punch analysis
            </div>
            <div class="meta-item">
                <strong>Training history</strong>
                Statistics and progress
            </div>
            <div class="meta-item">
                <strong>Data export</strong>
                CSV · JSON · PDF
            </div>
        </div>
    </div>
</body>
</html>
