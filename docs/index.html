<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PunchMeter v0.2 - Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a2e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 800px;
            width: 100%;
        }

        .logo {
            font-size: 72px;
            margin-bottom: 10px;
            animation: punch 0.6s ease-out;
        }

        @keyframes punch {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        h1 {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff1a1a 0%, #ff6b6b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 26, 26, 0.3);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .version {
            font-size: 24px;
            color: #888;
            margin-bottom: 15px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .tagline {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .download-buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.7s both;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            padding: 25px 50px;
            font-size: 24px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff1a1a 0%, #cc0000 100%);
            color: white;
            border: 3px solid #ff1a1a;
        }

        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 26, 26, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #2d2d44 0%, #1a1a2e 100%);
            color: white;
            border: 3px solid #444;
        }

        .btn-secondary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(100, 100, 150, 0.3);
            border-color: #666;
        }

        .btn-icon {
            font-size: 32px;
            position: relative;
            z-index: 1;
        }

        .btn-text {
            position: relative;
            z-index: 1;
        }

        .features {
            margin-top: 60px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            animation: fadeIn 1s ease-out 0.9s both;
        }

        .feature {
            font-size: 16px;
            color: #888;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-icon {
            font-size: 24px;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 40px; }
            .btn { padding: 20px 40px; font-size: 20px; }
            .download-buttons { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🥊</div>
        <h1>PunchMeter</h1>
        <div class="version">v0.2</div>
        <div class="tagline">Measure. Analyze. Improve.</div>
        
        <div class="download-buttons">
            <a href="#" class="btn btn-primary pulse" onclick="return false;">
                <span class="btn-icon">⬇️</span>
                <span class="btn-text">Download Release</span>
            </a>
            <a href="#" class="btn btn-secondary" onclick="return false;">
                <span class="btn-icon">📦</span>
                <span class="btn-text">Download Source</span>
            </a>
        </div>

        <div class="features">
            <div class="feature">
                <span class="feature-icon">🎤</span>
                <span>Microphone-based</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📊</span>
                <span>Real-time Analysis</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🏆</span>
                <span>Progress Tracking</span>
            </div>
        </div>
    </div>
</body>
</html>
